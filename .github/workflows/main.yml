name: Build PHP 8.3 Linux + test + backup

on:
  push:
    branches: "**"
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:

  # ============================================================
  # Linux x86_64 — el Linux "normal" de toda la vida
  # Runner: ubuntu-22.04 (x86_64 nativo)
  # ============================================================
  build-linux-x86:
    name: Compile PHP 8.3 Linux x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Verify x86_64 architecture
        run: |
          echo "=== Architecture check ==="
          uname -m
          file /bin/bash
          echo "=== Should show x86_64 ==="

      - name: Prepare compile.sh download cache
        id: download-cache-x86
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-x86_64-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-x86_64-

      - name: Compile PHP
        run: |
          chmod +x ./compile.sh
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t linux64 -j $(nproc) -g -P 5 -c ./download_cache -D -z 8.3

      - name: Verify compiled binary is x86_64
        run: |
          echo "=== Compiled PHP binary architecture ==="
          file bin/php7/bin/php
          echo "=== Should say 'ELF 64-bit LSB ... x86-64' ==="
          bin/php7/bin/php --version

      - name: Create tarball
        run: |
          tar -czf ./PHP-8.3-Linux-x86_64-PM5.tar.gz bin
          tar -czf ./Z-PHP-8.3-Linux-x86_64-PM5-debugging-symbols.tar.gz bin-debug

      - name: Upload PHP binary artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-8.3-Linux-x86_64-PM5
          path: |
            ./*PHP-8.3-Linux-x86_64-PM5*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data || true

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: PHP-8.3-Linux-x86_64-workspace-PM5
          path: |
            workspace.tar.gz
          if-no-files-found: warn

  # ============================================================
  # Test + backup para Linux x86_64
  # ============================================================
  test-and-backup-x86:
    name: Test x86_64 binary + build backup
    needs: build-linux-x86
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip tar

      - name: Download Linux x86_64 PHP artifact
        uses: actions/download-artifact@v8
        with:
          name: PHP-8.3-Linux-x86_64-PM5
          path: ${{ github.workspace }}/php-bin

      - name: Extract PHP binary
        run: |
          cd ${{ github.workspace }}/php-bin
          ls -la
          tar -xzf ./PHP-8.3-Linux-x86_64-PM5.tar.gz -C ${{ github.workspace }}
          ls -la ${{ github.workspace }}/bin/php7/bin/
          chmod +x ${{ github.workspace }}/bin/php7/bin/php
          find ${{ github.workspace }}/bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          echo "=== Verify binary architecture ==="
          file ${{ github.workspace }}/bin/php7/bin/php
          ${{ github.workspace }}/bin/php7/bin/php --version

      - name: Download PocketMine-MP.phar from MediaFire
        run: |
          mkdir -p ${{ github.workspace }}/server
          cd ${{ github.workspace }}/server
          wget -q --tries=3 --timeout=30 "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" -O mediafire_page.html || true
          DIRECT_URL=$(grep -oP 'https://download[0-9]+\.mediafire\.com/[^"'"'"']+\.phar' mediafire_page.html | head -1 || true)
          if [ -z "$DIRECT_URL" ]; then
            echo "Direct URL not found in page, trying alternative methods..."
            sudo apt-get install -y aria2 2>/dev/null || true
            aria2c --max-tries=3 --timeout=30 -o PocketMine-MP.phar "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" || true
          else
            echo "Found direct URL: $DIRECT_URL"
            wget -q --tries=3 --timeout=60 "$DIRECT_URL" -O PocketMine-MP.phar
          fi
          ls -la PocketMine-MP.phar
          file PocketMine-MP.phar

      - name: Setup server files
        run: |
          cd ${{ github.workspace }}/server
          if [ ! -f server.properties ]; then
            cat > server.properties << 'PROPS'
          motd=Aquamarine Test Server
          server-port=19132
          whitelist=off
          announce-player-achievements=on
          spawn-protection=16
          max-players=20
          allow-flight=off
          white-list=off
          server-ip=
          level-name=world
          level-seed=
          level-type=DEFAULT
          force-gamemode=off
          gamemode=0
          difficulty=1
          generator-settings=
          level-settings=
          online-mode=off
          view-distance=8
          allow-nether=on
          spawn-animals=on
          spawn-mobs=on
          pvp=on
          enable-query=on
          enable-rcon=off
          rcon.password=
          auto-save=on
          PROPS
          fi
          if [ ! -f pocketmine.yml ]; then
            cat > pocketmine.yml << 'YML'
          settings:
            force-language: false
            shutdown-message: "Server closed"
            query-plugins: true
            deprecated-verbose: true
            async-workers: auto
            memory-limit: 256M
          YML
          fi
          mkdir -p plugins worlds
          ls -la

      - name: Boot server and keep it running for 2 minutes
        run: |
          cd ${{ github.workspace }}/server
          chmod +x ${{ github.workspace }}/bin/php7/bin/php
          find ${{ github.workspace }}/bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          cat > start.sh << 'STARTSH'
          #!/bin/sh
          chmod +x ./bin/php7/bin/php
          ./bin/php7/bin/php ./PocketMine-MP.phar --no-wizard
          STARTSH
          chmod +x start.sh
          if [ ! -d ./bin ]; then
            cp -a ${{ github.workspace }}/bin ./bin
            chmod +x ./bin/php7/bin/php
            find ./bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          fi
          echo "=== Verifying PHP binary works ==="
          ./bin/php7/bin/php --version
          echo "---"
          echo "=== Booting server ==="
          sed -i 's|--no-wizard|--no-wizard --disable-ansi|' start.sh
          nohup ./start.sh > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "=== Phase 1: Waiting for boot (up to 180s) ==="
          BOOT_OK=0
          for i in $(seq 1 180); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died at second $i."
              break
            fi
            if grep -qiE 'Done \(.*\)!|Done \(' server.log 2>/dev/null; then
              echo "Server finished booting at second $i."
              BOOT_OK=1
              break
            fi
            sleep 1
          done
          if [ "$BOOT_OK" -ne 1 ]; then
            echo "Server did not finish booting within 180s."
            kill -TERM $SERVER_PID 2>/dev/null || true
            sleep 3
            kill -KILL $SERVER_PID 2>/dev/null || true
            cat server.log
            exit 0
          fi
          echo "=== Phase 2: Running 120s ==="
          for i in $(seq 1 120); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server died at second $i of phase 2."
              break
            fi
            sleep 1
          done
          echo "=== Phase 3: Stopping server ==="
          if kill -0 $SERVER_PID 2>/dev/null; then
            kill -TERM $SERVER_PID || true
            sleep 5
            if kill -0 $SERVER_PID 2>/dev/null; then
              kill -KILL $SERVER_PID 2>/dev/null || true
            fi
          fi
          tail -n 200 server.log

      - name: Build ready-to-run server backup
        if: always()
        run: |
          set -x
          STAGE="${{ github.workspace }}/stage-x86"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          if [ -d ${{ github.workspace }}/bin ]; then
            cp -a ${{ github.workspace }}/bin "$STAGE/bin"
            chmod +x "$STAGE/bin/php7/bin/php" 2>/dev/null || true
            find "$STAGE/bin" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
            echo "=== Resolving symlinks ==="
            find "$STAGE/bin" -type l | while read -r LINK; do
              TARGET=$(readlink -f "$LINK")
              if [ -n "$TARGET" ] && [ -f "$TARGET" ]; then
                rm -f "$LINK"
                cp -a "$TARGET" "$LINK"
                chmod +x "$LINK" 2>/dev/null || true
              fi
            done
          fi
          [ -f ${{ github.workspace }}/server/PocketMine-MP.phar ] && cp -a ${{ github.workspace }}/server/PocketMine-MP.phar "$STAGE/"
          for f in server.properties pocketmine.yml ops.txt whitelist.txt banned-players.txt banned-ips.txt; do
            [ -f ${{ github.workspace }}/server/$f ] && cp -a ${{ github.workspace }}/server/$f "$STAGE/$f"
          done
          [ -d ${{ github.workspace }}/server/worlds ] && cp -a ${{ github.workspace }}/server/worlds "$STAGE/worlds"
          for w in world nether ender; do
            [ -d ${{ github.workspace }}/server/$w ] && cp -a ${{ github.workspace }}/server/$w "$STAGE/$w"
          done
          [ -d ${{ github.workspace }}/server/plugins ]     && cp -a ${{ github.workspace }}/server/plugins "$STAGE/plugins"
          [ -d ${{ github.workspace }}/server/plugin_data ] && cp -a ${{ github.workspace }}/server/plugin_data "$STAGE/plugin_data"
          [ -d ${{ github.workspace }}/server/crashdumps ]  && cp -a ${{ github.workspace }}/server/crashdumps "$STAGE/crashdumps"
          [ -f ${{ github.workspace }}/server/server.log ]  && cp -a ${{ github.workspace }}/server/server.log "$STAGE/server.log"
          [ -f ${{ github.workspace }}/php-bin/install.log ] && cp -a ${{ github.workspace }}/php-bin/install.log "$STAGE/install.log"
          [ -f ${{ github.workspace }}/php-bin/compile.sh ]  && cp -a ${{ github.workspace }}/php-bin/compile.sh "$STAGE/compile.sh"
          cat > "$STAGE/README.txt" << 'README'
          Aquamarine - Linux x86_64 server backup
          ========================================

          HOW TO RUN:
            1. mkdir -p /opt/aquamarine && cd /opt/aquamarine
            2. tar -xzf server-backup-x86_64-*.tar.gz
            3. ./bin/php7/bin/php PocketMine-MP.phar
          README
          cd ${{ github.workspace }}
          tar -czpf server-backup-x86_64-PHP8.3.tar.gz -C "$STAGE" --transform 's|^\./||' .
          ls -la server-backup-x86_64-PHP8.3.tar.gz
          tar -tzf server-backup-x86_64-PHP8.3.tar.gz | head -20

      - name: Upload server backup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerBackup-x86_64-PHP8.3
          path: ${{ github.workspace }}/server-backup-x86_64-PHP8.3.tar.gz
          if-no-files-found: warn

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerLog-x86_64-PHP8.3
          path: ${{ github.workspace }}/server/server.log
          if-no-files-found: warn

  # ============================================================
  # Linux ARM64 — Cobalt 100 / servidores ARM
  # Runner: ubuntu-22.04-arm (ARM64 nativo)
  # ============================================================
  build-linux:
    name: Compile PHP 8.3 Linux ARM64
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Verify ARM64 architecture
        run: |
          echo "=== Architecture check ==="
          uname -m
          file /bin/bash
          echo "=== If the above shows aarch64, the binary will be ARM64-native ==="

      - name: Verify compile.sh has ARM64 patch
        run: |
          echo "=== Checking if compile.sh has the ARM64 patch ==="
          if grep -q 'Compiling for Linux aarch64' ./compile.sh; then
            echo "OK: compile.sh has the ARM64 patch."
          else
            echo "ERROR: compile.sh does NOT have the ARM64 patch!"
            exit 1
          fi

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-arm64-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-arm64-

      - name: Compile PHP
        run: |
          chmod +x ./compile.sh
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t linux64 -j 4 -g -P 5 -c ./download_cache -D -z 8.3

      - name: Verify compiled binary is ARM64
        run: |
          echo "=== Compiled PHP binary architecture ==="
          file bin/php7/bin/php
          echo "=== If it says 'ELF 64-bit LSB ... ARM aarch64', it's correct for your Cobalt 100 ARM64 ==="

      - name: Create tarball
        run: |
          tar -czf ./PHP-8.3-Linux-ARM64-PM5.tar.gz bin
          tar -czf ./Z-PHP-8.3-Linux-ARM64-PM5-debugging-symbols.tar.gz bin-debug

      - name: Upload PHP binary artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-8.3-Linux-PM5
          path: |
            ./*PHP-8.3-Linux-ARM64-PM5*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data || true

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: PHP-8.3-Linux-workspace-PM5
          path: |
            workspace.tar.gz
          if-no-files-found: warn

  test-and-backup:
    name: Test with PocketMine-MP.phar + build backup
    needs: build-linux
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip tar

      - name: Download Linux PHP artifact
        uses: actions/download-artifact@v8
        with:
          name: PHP-8.3-Linux-PM5
          path: ${{ github.workspace }}/php-bin

      - name: Extract PHP binary
        run: |
          cd ${{ github.workspace }}/php-bin
          ls -la
          tar -xzf ./PHP-8.3-Linux-ARM64-PM5.tar.gz -C ${{ github.workspace }}
          ls -la ${{ github.workspace }}/bin/php7/bin/
          chmod +x ${{ github.workspace }}/bin/php7/bin/php
          find ${{ github.workspace }}/bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          echo "=== Verify binary architecture ==="
          file ${{ github.workspace }}/bin/php7/bin/php
          ${{ github.workspace }}/bin/php7/bin/php --version

      - name: Download PocketMine-MP.phar from MediaFire
        run: |
          mkdir -p ${{ github.workspace }}/server
          cd ${{ github.workspace }}/server
          wget -q --tries=3 --timeout=30 "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" -O mediafire_page.html || true
          DIRECT_URL=$(grep -oP 'https://download[0-9]+\.mediafire\.com/[^"'"'"']+\.phar' mediafire_page.html | head -1 || true)
          if [ -z "$DIRECT_URL" ]; then
            echo "Direct URL not found in page, trying alternative methods..."
            sudo apt-get install -y aria2 2>/dev/null || true
            aria2c --max-tries=3 --timeout=30 -o PocketMine-MP.phar "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" || true
          else
            echo "Found direct URL: $DIRECT_URL"
            wget -q --tries=3 --timeout=60 "$DIRECT_URL" -O PocketMine-MP.phar
          fi
          ls -la PocketMine-MP.phar
          file PocketMine-MP.phar

      - name: Setup server files
        run: |
          cd ${{ github.workspace }}/server
          if [ ! -f server.properties ]; then
            cat > server.properties << 'PROPS'
          motd=Aquamarine Test Server
          server-port=19132
          whitelist=off
          announce-player-achievements=on
          spawn-protection=16
          max-players=20
          allow-flight=off
          white-list=off
          server-ip=
          level-name=world
          level-seed=
          level-type=DEFAULT
          force-gamemode=off
          gamemode=0
          difficulty=1
          generator-settings=
          level-settings=
          online-mode=off
          view-distance=8
          allow-nether=on
          spawn-animals=on
          spawn-mobs=on
          pvp=on
          enable-query=on
          enable-rcon=off
          rcon.password=
          auto-save=on
          PROPS
          fi
          if [ ! -f pocketmine.yml ]; then
            cat > pocketmine.yml << 'YML'
          settings:
            force-language: false
            shutdown-message: "Server closed"
            query-plugins: true
            deprecated-verbose: true
            async-workers: auto
            memory-limit: 256M
          YML
          fi
          mkdir -p plugins worlds
          ls -la

      - name: Boot server using start.sh and keep it running for 2 minutes
        run: |
          cd ${{ github.workspace }}/server
          chmod +x ${{ github.workspace }}/bin/php7/bin/php
          find ${{ github.workspace }}/bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          cat > start.sh << 'STARTSH'
          #!/bin/sh
          chmod +x ./bin/php7/bin/php
          ./bin/php7/bin/php ./PocketMine-MP.phar --no-wizard
          STARTSH
          chmod +x start.sh
          if [ ! -d ./bin ]; then
            cp -a ${{ github.workspace }}/bin ./bin
            chmod +x ./bin/php7/bin/php
            find ./bin -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          fi
          echo "=== Verifying PHP binary works ==="
          ./bin/php7/bin/php --version
          echo "---"
          echo "=== Booting server with start.sh (logs to server.log) ==="
          sed -i 's|--no-wizard|--no-wizard --disable-ansi|' start.sh
          cat start.sh
          echo "---"
          nohup ./start.sh > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "=== Phase 1: Waiting for server to finish booting (up to 180s) ==="
          BOOT_OK=0
          for i in $(seq 1 180); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died before finishing boot at second $i."
              break
            fi
            if grep -qiE 'Done \(.*\)!|Done \(' server.log 2>/dev/null; then
              echo "Server finished booting at second $i."
              BOOT_OK=1
              break
            fi
            sleep 1
          done
          if [ "$BOOT_OK" -ne 1 ]; then
            echo "Server did not finish booting within 180s. Forcing stop."
            kill -TERM $SERVER_PID 2>/dev/null || true
            sleep 3
            kill -KILL $SERVER_PID 2>/dev/null || true
            echo "--- Server log ---"
            cat server.log
            echo "--- End of log ---"
            exit 0
          fi
          echo "=== Phase 2: Server is up. Letting it run for 120s to generate real data ==="
          for i in $(seq 1 120); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died on its own at second $i of phase 2."
              break
            fi
            sleep 1
          done
          echo "=== Phase 3: Stopping server ==="
          if kill -0 $SERVER_PID 2>/dev/null; then
            kill -TERM $SERVER_PID || true
            sleep 5
            if kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server did not respond to SIGTERM, sending SIGKILL."
              kill -KILL $SERVER_PID 2>/dev/null || true
            fi
          fi
          echo "--- Server log (tail) ---"
          tail -n 200 server.log
          echo "--- End of log ---"
          echo "=== Generated files ==="
          ls -la
          echo ""
          echo "=== Recursive tree ==="
          find . -maxdepth 3 -type f -printf '%y %m %p\n' | head -80

      - name: Build ready-to-run server backup (binary + phar + worlds + plugins)
        if: always()
        run: |
          set -x
          STAGE="${{ github.workspace }}/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          if [ -d ${{ github.workspace }}/bin ]; then
            cp -a ${{ github.workspace }}/bin "$STAGE/bin"
            chmod +x "$STAGE/bin/php7/bin/php" 2>/dev/null || true
            find "$STAGE/bin" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
            find "$STAGE/bin" -type f -path "*/bin/*" -exec chmod +x {} \; 2>/dev/null || true
            echo "=== Resolving symlinks in bin/ to regular files ==="
            find "$STAGE/bin" -type l | while read -r LINK; do
              TARGET=$(readlink -f "$LINK")
              if [ -n "$TARGET" ] && [ -f "$TARGET" ]; then
                rm -f "$LINK"
                cp -a "$TARGET" "$LINK"
                chmod +x "$LINK" 2>/dev/null || true
              fi
            done
            find "$STAGE/bin" -type f -name "*.so*" -exec chmod +x {} \; 2>/dev/null || true
          fi
          [ -f ${{ github.workspace }}/server/PocketMine-MP.phar ] && cp -a ${{ github.workspace }}/server/PocketMine-MP.phar "$STAGE/"
          for f in server.properties pocketmine.yml ops.txt whitelist.txt banned-players.txt banned-ips.txt; do
            [ -f ${{ github.workspace }}/server/$f ] && cp -a ${{ github.workspace }}/server/$f "$STAGE/$f"
          done
          [ -d ${{ github.workspace }}/server/worlds ] && cp -a ${{ github.workspace }}/server/worlds "$STAGE/worlds"
          for w in world nether ender; do
            [ -d ${{ github.workspace }}/server/$w ] && cp -a ${{ github.workspace }}/server/$w "$STAGE/$w"
          done
          [ -d ${{ github.workspace }}/server/plugins ]     && cp -a ${{ github.workspace }}/server/plugins "$STAGE/plugins"
          [ -d ${{ github.workspace }}/server/plugin_data ] && cp -a ${{ github.workspace }}/server/plugin_data "$STAGE/plugin_data"
          [ -d ${{ github.workspace }}/server/crashdumps ]  && cp -a ${{ github.workspace }}/server/crashdumps "$STAGE/crashdumps"
          [ -f ${{ github.workspace }}/server/server.log ]  && cp -a ${{ github.workspace }}/server/server.log "$STAGE/server.log"
          [ -f ${{ github.workspace }}/php-bin/install.log ] && cp -a ${{ github.workspace }}/php-bin/install.log "$STAGE/install.log"
          [ -f ${{ github.workspace }}/php-bin/compile.sh ]  && cp -a ${{ github.workspace }}/php-bin/compile.sh "$STAGE/compile.sh"
          echo "=== Backup top-level layout ==="
          ls -la "$STAGE"
          cat > "$STAGE/README.txt" << 'README'
          Aquamarine - Server backup
          =========================================

          HOW TO RUN ON A FRESH SERVER:
            1. mkdir -p /opt/aquamarine && cd /opt/aquamarine
            2. tar -xzf server-backup-*.tar.gz
            3. ./bin/php7/bin/php PocketMine-MP.phar
          README
          cd ${{ github.workspace }}
          tar -czpf server-backup-PM5-PHP8.3.tar.gz -C "$STAGE" --transform 's|^\./||' .
          ls -la server-backup-PM5-PHP8.3.tar.gz
          tar -tzf server-backup-PM5-PHP8.3.tar.gz | head -20

      - name: Upload server backup (tar.gz, flat layout, permissions preserved)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerBackup-PM5-PHP8.3
          path: ${{ github.workspace }}/server-backup-PM5-PHP8.3.tar.gz
          if-no-files-found: warn

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerLog-PM5-PHP8.3
          path: ${{ github.workspace }}/server/server.log
          if-no-files-found: warn

  # ============================================================
  # Android arm64-v8a (aarch64) — static PHP CLI binary
  # Target: Android 15, SDK 35, arm64-v8a (Samsung SM-A146M etc.)
  # ============================================================
  build-android:
    name: Compile PHP 8.3 Android arm64-v8a (static)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-android-arm64-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-android-arm64-

      - name: Fetch musl cross-compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build musl cross-compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Verify compile.sh has ARM64 patch
        run: |
          if grep -q 'Compiling for Linux aarch64' ./compile.sh; then
            echo "OK: compile.sh has the ARM64 patch."
          else
            echo "WARNING: compile.sh does NOT have the ARM64 patch, but this is fine for the android-aarch64 target which has its own flags."
          fi

      - name: Compile PHP (static for Android arm64-v8a)
        run: |
          chmod +x ./compile.sh
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j 4 -g -P 5 -c ./download_cache -D -z 8.3

      - name: Verify static binary
        run: |
          echo "=== Compiled PHP binary ==="
          file bin/php7/bin/php
          echo ""
          echo "=== Check it's static (no shared libs) ==="
          ls -la bin/php7/bin/php
          if file bin/php7/bin/php | grep -qi 'statically linked'; then
            echo "OK: binary is statically linked."
          else
            echo "WARNING: binary may not be fully static. Check the file output above."
          fi

      - name: Create tarball with static binary only
        run: |
          mkdir -p android-out
          cp bin/php7/bin/php android-out/php
          chmod +x android-out/php
          tar -czf ./PHP-8.3-Android-arm64-static-PM5.tar.gz -C android-out .
          ls -la ./PHP-8.3-Android-arm64-static-PM5.tar.gz

      - name: Upload PHP static binary artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-8.3-Android-arm64-static-PM5
          path: |
            ./PHP-8.3-Android-arm64-static-PM5.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data || true

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: PHP-8.3-Android-workspace-PM5
          path: |
            workspace.tar.gz
          if-no-files-found: warn

  test-and-backup-android:
    name: Test Android static binary + build backup
    needs: build-android
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip tar

      - name: Download Android PHP static binary artifact
        uses: actions/download-artifact@v8
        with:
          name: PHP-8.3-Android-arm64-static-PM5
          path: ${{ github.workspace }}/php-bin

      - name: Extract static PHP binary
        run: |
          cd ${{ github.workspace }}/php-bin
          ls -la
          tar -xzf ./PHP-8.3-Android-arm64-static-PM5.tar.gz -C ${{ github.workspace }}/server-bin
          mkdir -p ${{ github.workspace }}/server-bin
          if [ -f ${{ github.workspace }}/php ]; then
            mv ${{ github.workspace }}/php ${{ github.workspace }}/server-bin/php
          fi
          tar -xzf ./PHP-8.3-Android-arm64-static-PM5.tar.gz -C ${{ github.workspace }}/server-bin
          ls -la ${{ github.workspace }}/server-bin/
          chmod +x ${{ github.workspace }}/server-bin/php
          echo "=== Verify binary ==="
          file ${{ github.workspace }}/server-bin/php
          echo "=== Test it runs ==="
          ${{ github.workspace }}/server-bin/php --version

      - name: Download PocketMine-MP.phar from MediaFire
        run: |
          mkdir -p ${{ github.workspace }}/server
          cd ${{ github.workspace }}/server
          wget -q --tries=3 --timeout=30 "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" -O mediafire_page.html || true
          DIRECT_URL=$(grep -oP 'https://download[0-9]+\.mediafire\.com/[^"'"'"']+\.phar' mediafire_page.html | head -1 || true)
          if [ -z "$DIRECT_URL" ]; then
            echo "Direct URL not found in page, trying alternative methods..."
            sudo apt-get install -y aria2 2>/dev/null || true
            aria2c --max-tries=3 --timeout=30 -o PocketMine-MP.phar "https://www.mediafire.com/file/v8he69aaxzkhpe7/PocketMine-MP.phar/file" || true
          else
            echo "Found direct URL: $DIRECT_URL"
            wget -q --tries=3 --timeout=60 "$DIRECT_URL" -O PocketMine-MP.phar
          fi
          ls -la PocketMine-MP.phar
          file PocketMine-MP.phar

      - name: Setup server files for Android
        run: |
          cd ${{ github.workspace }}/server
          if [ ! -f server.properties ]; then
            cat > server.properties << 'PROPS'
          motd=Aquamarine Android Test Server
          server-port=19132
          whitelist=off
          announce-player-achievements=on
          spawn-protection=16
          max-players=20
          allow-flight=off
          white-list=off
          server-ip=
          level-name=world
          level-seed=
          level-type=DEFAULT
          force-gamemode=off
          gamemode=0
          difficulty=1
          generator-settings=
          level-settings=
          online-mode=off
          view-distance=8
          allow-nether=on
          spawn-animals=on
          spawn-mobs=on
          pvp=on
          enable-query=on
          enable-rcon=off
          rcon.password=
          auto-save=on
          PROPS
          fi
          if [ ! -f pocketmine.yml ]; then
            cat > pocketmine.yml << 'YML'
          settings:
            force-language: false
            shutdown-message: "Server closed"
            query-plugins: true
            deprecated-verbose: true
            async-workers: auto
            memory-limit: 256M
          YML
          fi
          mkdir -p plugins worlds
          cp ${{ github.workspace }}/server-bin/php ./php
          chmod +x ./php
          cat > start.sh << 'STARTSH'
          #!/bin/sh
          chmod +x ./php
          ./php ./PocketMine-MP.phar --no-wizard
          STARTSH
          chmod +x start.sh
          ls -la

      - name: Boot Android server using start.sh and keep it running for 2 minutes
        run: |
          cd ${{ github.workspace }}/server
          echo "=== Verifying static PHP binary works ==="
          ./php --version
          echo "---"
          echo "=== Booting server with start.sh ==="
          sed -i 's|--no-wizard|--no-wizard --disable-ansi|' start.sh
          cat start.sh
          echo "---"
          nohup ./start.sh > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "=== Phase 1: Waiting for server to finish booting (up to 180s) ==="
          BOOT_OK=0
          for i in $(seq 1 180); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died before finishing boot at second $i."
              break
            fi
            if grep -qiE 'Done \(.*\)!|Done \(' server.log 2>/dev/null; then
              echo "Server finished booting at second $i."
              BOOT_OK=1
              break
            fi
            sleep 1
          done
          if [ "$BOOT_OK" -ne 1 ]; then
            echo "Server did not finish booting within 180s."
            kill -TERM $SERVER_PID 2>/dev/null || true
            sleep 3
            kill -KILL $SERVER_PID 2>/dev/null || true
            cat server.log
            exit 0
          fi
          echo "=== Phase 2: Running for 120s ==="
          for i in $(seq 1 120); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server died at second $i of phase 2."
              break
            fi
            sleep 1
          done
          echo "=== Phase 3: Stopping server ==="
          if kill -0 $SERVER_PID 2>/dev/null; then
            kill -TERM $SERVER_PID || true
            sleep 5
            if kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server did not respond to SIGTERM, sending SIGKILL."
              kill -KILL $SERVER_PID 2>/dev/null || true
            fi
          fi
          echo "--- Server log (tail) ---"
          tail -n 200 server.log
          echo "--- End of log ---"
          echo "=== Generated files ==="
          ls -la

      - name: Build Android server backup (static php + phar + worlds + plugins)
        if: always()
        run: |
          set -x
          STAGE="${{ github.workspace }}/stage-android"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          [ -f ${{ github.workspace }}/server/php ] && cp -a ${{ github.workspace }}/server/php "$STAGE/php" && chmod +x "$STAGE/php"
          [ -f ${{ github.workspace }}/server/PocketMine-MP.phar ] && cp -a ${{ github.workspace }}/server/PocketMine-MP.phar "$STAGE/"
          cat > "$STAGE/start.sh" << 'STARTSH'
          #!/bin/sh
          chmod +x ./php
          ./php ./PocketMine-MP.phar --no-wizard
          STARTSH
          chmod +x "$STAGE/start.sh"
          for f in server.properties pocketmine.yml ops.txt whitelist.txt banned-players.txt banned-ips.txt; do
            [ -f ${{ github.workspace }}/server/$f ] && cp -a ${{ github.workspace }}/server/$f "$STAGE/$f"
          done
          [ -d ${{ github.workspace }}/server/worlds ] && cp -a ${{ github.workspace }}/server/worlds "$STAGE/worlds"
          for w in world nether ender; do
            [ -d ${{ github.workspace }}/server/$w ] && cp -a ${{ github.workspace }}/server/$w "$STAGE/$w"
          done
          [ -d ${{ github.workspace }}/server/plugins ]     && cp -a ${{ github.workspace }}/server/plugins "$STAGE/plugins"
          [ -d ${{ github.workspace }}/server/plugin_data ] && cp -a ${{ github.workspace }}/server/plugin_data "$STAGE/plugin_data"
          [ -d ${{ github.workspace }}/server/crashdumps ]  && cp -a ${{ github.workspace }}/server/crashdumps "$STAGE/crashdumps"
          [ -f ${{ github.workspace }}/server/server.log ]  && cp -a ${{ github.workspace }}/server/server.log "$STAGE/server.log"
          [ -f ${{ github.workspace }}/php-bin/install.log ] && cp -a ${{ github.workspace }}/php-bin/install.log "$STAGE/install.log"
          [ -f ${{ github.workspace }}/php-bin/compile.sh ]  && cp -a ${{ github.workspace }}/php-bin/compile.sh "$STAGE/compile.sh"
          cat > "$STAGE/README.txt" << 'README'
          Aquamarine - Android arm64-v8a server backup
          ============================================

          HOW TO RUN ON ANDROID (Termux):
            1. termux-setup-storage
            2. mkdir -p ~/aquamarine && cd ~/aquamarine
            3. tar -xzf server-backup-android-*.tar.gz
            4. ./start.sh
          README
          cd ${{ github.workspace }}
          tar -czpf server-backup-Android-arm64-PHP8.3.tar.gz -C "$STAGE" --transform 's|^\./||' .
          ls -la server-backup-Android-arm64-PHP8.3.tar.gz
          tar -tzf server-backup-Android-arm64-PHP8.3.tar.gz | head -20

      - name: Upload Android server backup (tar.gz)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerBackup-Android-arm64-PHP8.3
          path: ${{ github.workspace }}/server-backup-Android-arm64-PHP8.3.tar.gz
          if-no-files-found: warn

      - name: Upload Android server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ServerLog-Android-arm64-PHP8.3
          path: ${{ github.workspace }}/server/server.log
          if-no-files-found: warn
